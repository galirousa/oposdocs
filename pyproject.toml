[project]
name = "opos"
version = "0.1.0"
description = "Document platform for Spanish public-sector exam candidates (oposiciones)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "django-environ>=0.11",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "celery>=5.4",
    "django-storages[s3]>=1.14",
    "django-allauth>=65.0",
    "argon2-cffi>=23.1",
    "python-docx>=1.1",
    "pillow>=10.4",
    "whitenoise>=6.7",
    "gunicorn>=22.0",
    "sentry-sdk>=2.0",
    "requests>=2.32",
    "pyjwt[crypto]>=2.9",
    # Posts are written in markdown and rendered on save; nh3 (Rust ammonia)
    # sanitises the result against an allowlist. bleach is unmaintained.
    "markdown>=3.6",
    "nh3>=0.2.18",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "django-debug-toolbar>=4.4",
    "django-extensions>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Django apps live at the repository root; nothing here is packaged for
# distribution, so package discovery is disabled.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations — type hints on all signatures
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # allow typing.Any where it is genuinely the right type
    "RUF012",  # Django class attributes are not ClassVar-annotated by convention
    "DJ012",   # model member ordering: properties grouped by topic reads better here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"**/tests/**" = ["ANN"]
"conftest.py" = ["ANN"]
"**/factories.py" = ["ANN"]
"**/settings/*.py" = ["F403", "F405"]
"manage.py" = ["ANN", "T20"]
# Seed data holds real Spanish titles and BOE references; keep them on one line.
"**/management/commands/seed_*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "tests.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--reuse-db",
]
markers = [
    "slow: tests that are slow enough to skip during a tight edit loop",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/settings/*",
    "manage.py",
]
