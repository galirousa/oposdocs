name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploys are manual: the deploy job below is gated on this trigger, and
  # without it declared here that job could never run at all.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: opos
          POSTGRES_USER: opos
          POSTGRES_PASSWORD: opos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      SECRET_KEY: ci-only
      DEBUG: "true"
      DATABASE_URL: postgres://opos:opos@localhost:5432/opos
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      ALLOWED_HOSTS: localhost,testserver
      ALLOW_INDEXING: "true"
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - run: pytest

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Derive the image name
        # GHCR repository names must be lowercase and ours is galirousa/Oposdocs,
        # so github.repository cannot be used verbatim as a tag.
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    # Manually triggered: same single command you can run by hand on the host
    # (./deploy.sh). Building happens in CI so the server never competes with
    # serving traffic; this job only pulls the image already published by the
    # last push to main.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # Without this, a manual deploy would race lint and test and could ship
    # a red build.
    needs: [lint, test]
    environment: production
    steps:
      - name: Check the deploy secrets exist
        # An unset secret becomes an empty string, and the ssh action then
        # fails with an opaque connection error. Say what is actually wrong.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing" >&2
            echo "Add them under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /srv/opos && ./deploy.sh
